<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tekne — editor</title>
<!-- Mockup exported from the Claude Design canvas. Static reference only:
     the logic below is mockup code, not something to copy into the app. -->
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid rgba(255,255,255,0.55);outline-offset:1px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
.hov:hover{background:rgba(255,255,255,0.05)}
.row:hover{background:rgba(255,255,255,0.025)}
.tbtn{opacity:0;transition:opacity .12s}
.row:hover .tbtn,.tbtn:focus-within{opacity:1}
.seg:hover{text-decoration:underline;text-underline-offset:3px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
</style>
</head>
<body>
<div id="root"></div>
<template id="dc-template">

<div style="width: 100%; height: 900px; display: flex; flex-direction: column; background: {{ c.bg }}; color: {{ c.text }}; font-family: system-ui, -apple-system, sans-serif; font-size: 15px; overflow: hidden; position: relative;">

  <div style="flex: 1; min-height: 0; display: flex; flex-wrap: wrap;">

    <main style="flex: 999 1 560px; min-width: 0; height: 100%; overflow-y: auto; position: relative;">

      <div style="max-width: 860px; margin: 0 auto; box-sizing: border-box; padding: 64px 24px 160px 0;">

        <div style="display: flex;">
          <span style="width: 96px; flex-shrink: 0;"></span>
          <div style="flex: 1; min-width: 0; padding: 0 0 22px 8px;">
            <div style="min-height: 40px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px;">
              <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; color: {{ c.head }};">{{ title }}</h1>
              <sc-if value="{{ isDateDoc }}" hint-placeholder-val="{{ true }}">
                <div style="display: flex; align-items: center; gap: 2px;">
                  <button class="hov" aria-label="Previous day" onClick="{{ prevDay }}" style="width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: {{ c.text3 }};">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
                  </button>
                  <button class="hov" aria-label="Next day" onClick="{{ nextDay }}" style="width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: {{ c.text3 }};">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
                  </button>
                  <sc-if value="{{ notToday }}" hint-placeholder-val="{{ false }}">
                    <button class="hov" onClick="{{ goToday }}" style="height: 26px; padding: 0 9px; border-radius: 7px; font-size: 13px; color: {{ c.accent }};">Today</button>
                  </sc-if>
                </div>
              </sc-if>
              <span style="flex: 1;"></span>
              <div style="display: flex; align-items: center; gap: 4px;">
                <sc-if value="{{ hasTimer }}" hint-placeholder-val="{{ true }}">
                  <button aria-label="Go to running timer" onClick="{{ jumpToTimer }}" style="height: 30px; padding: 0 12px; border-radius: 15px; display: flex; align-items: center; gap: 8px; background: {{ headChipBg }}; color: {{ headChipColor }};">
                    <span class="{{ headDotClass }}" style="width: 6px; height: 6px; border-radius: 3px; background: {{ headChipColor }};"></span>
                    <span class="mono" style="font-size: 12px;">{{ headChipTime }}</span>
                    <span style="font-size: 12px; color: {{ c.text2 }}; max-width: 180px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">{{ timerLineName }}</span>
                  </button>
                </sc-if>
                <button class="hov" aria-label="Open command palette" onClick="{{ openPalette }}" style="height: 30px; padding: 0 10px; border-radius: 8px; font-size: 12px; color: {{ c.text3 }};"><span class="mono">⌘K</span></button>
                <button class="hov" aria-label="Toggle data panel" aria-pressed="{{ panelOn }}" onClick="{{ togglePanel }}" style="width: 32px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: {{ panelIconColor }};">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M15 3v18"></path></svg>
                </button>
              </div>
            </div>
            <div style="margin-top: 4px; font-size: 13px; color: {{ c.text3 }};">{{ meta }}</div>
          </div>
        </div>

        <sc-for list="{{ lines }}" as="line" hint-placeholder-count="14">
          <div style="display: flex;">
            <div class="mono" style="width: 96px; flex-shrink: 0; box-sizing: border-box; padding: {{ line.tsPad }}px 14px 0 0; text-align: right; font-size: 11px; line-height: 16px; color: {{ c.text3 }}; white-space: nowrap;">{{ line.ts }}</div>
            <div style="flex: 1; min-width: 0;">
              <sc-if value="{{ line.isHead }}" hint-placeholder-val="{{ false }}">
                <h2 style="margin: 0; padding: 20px 0 6px {{ line.pad }}px; font-size: 18px; font-weight: 650; color: {{ c.head }};">{{ line.text }}</h2>
              </sc-if>
              <sc-if value="{{ line.isLine }}" hint-placeholder-val="{{ true }}">
                <div class="row" style="min-height: 30px; display: flex; align-items: flex-start; gap: 9px; padding: 0 8px 0 {{ line.pad }}px; border-radius: 6px; background: {{ line.rowBg }};">
                  <span style="width: 18px; height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
                    <button aria-label="{{ line.glyphLabel }}" onClick="{{ line.glyphClick }}" style="width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: {{ line.halo }};">
                      <sc-if value="{{ line.gDot }}" hint-placeholder-val="{{ true }}">
                        <span style="width: 5px; height: 5px; border-radius: 3px; background: {{ line.dotColor }};"></span>
                      </sc-if>
                      <sc-if value="{{ line.gPin }}" hint-placeholder-val="{{ false }}">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="{{ c.accent }}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"></path><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"></path></svg>
                      </sc-if>
                      <sc-if value="{{ line.gTask }}" hint-placeholder-val="{{ false }}">
                        <span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 4px; border: 1.5px solid {{ line.boxBorder }}; background: {{ line.boxBg }}; display: flex; align-items: center; justify-content: center; color: {{ c.accentInk }};">
                          <sc-if value="{{ line.isDone }}" hint-placeholder-val="{{ false }}">
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
                          </sc-if>
                          <sc-if value="{{ line.isCancelled }}" hint-placeholder-val="{{ false }}">
                            <span style="width: 6px; height: 1.5px; background: {{ c.text3 }};"></span>
                          </sc-if>
                        </span>
                      </sc-if>
                    </button>
                  </span>
                  <div style="flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; column-gap: 0.3em; row-gap: 2px; padding: 4px 0; line-height: 22px;">
                    <sc-for list="{{ line.segs }}" as="seg" hint-placeholder-count="2">
                      <sc-if value="{{ seg.isText }}" hint-placeholder-val="{{ true }}"><button onClick="{{ seg.click }}" style="color: {{ line.textColor }}; text-decoration: {{ line.deco }};">{{ seg.text }}</button></sc-if>
                      <sc-if value="{{ seg.isTag }}" hint-placeholder-val="{{ false }}"><button class="seg" onClick="{{ seg.click }}" style="color: {{ c.accent }};">{{ seg.text }}</button></sc-if>
                      <sc-if value="{{ seg.isLink }}" hint-placeholder-val="{{ false }}"><button onClick="{{ seg.click }}" style="color: {{ c.text }}; text-decoration: underline; text-decoration-color: {{ c.faint }}; text-underline-offset: 3px;">{{ seg.text }}</button></sc-if>
                      <sc-if value="{{ seg.isCode }}" hint-placeholder-val="{{ false }}"><code class="mono" style="font-size: 12.5px; padding: 1px 5px; border-radius: 4px; background: {{ c.sunk }}; color: {{ c.text }};">{{ seg.text }}</code></sc-if>
                    </sc-for>
                    <sc-if value="{{ line.pinTrail }}" hint-placeholder-val="{{ false }}">
                      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="{{ c.accent }}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="Pinned" role="img"><path d="M12 17v5"></path><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"></path></svg>
                    </sc-if>
                    <sc-if value="{{ line.hasChip }}" hint-placeholder-val="{{ false }}">
                      <button aria-label="{{ line.chipLabel }}" aria-expanded="{{ line.rowOpen }}" onClick="{{ line.chipClick }}" class="mono" style="height: 22px; margin-left: 4px; padding: 0 8px; border-radius: 11px; display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; background: {{ line.chipBg }}; color: {{ line.chipColor }};">
                        <sc-if value="{{ line.chipLive }}" hint-placeholder-val="{{ false }}"><span class="pulse" style="width: 6px; height: 6px; border-radius: 3px; background: {{ line.chipColor }};"></span></sc-if>
                        <sc-if value="{{ line.chipPaused }}" hint-placeholder-val="{{ false }}">
                          <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1"></rect><rect x="14" y="4" width="5" height="16" rx="1"></rect></svg>
                        </sc-if>
                        <sc-if value="{{ line.chipIdle }}" hint-placeholder-val="{{ true }}">
                          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
                        </sc-if>
                        <span>{{ line.chipText }}</span>
                      </button>
                    </sc-if>
                    <sc-if value="{{ line.isCollapsed }}" hint-placeholder-val="{{ false }}">
                      <button onClick="{{ line.expand }}" aria-label="{{ line.hiddenLabel }}" class="mono" style="height: 18px; padding: 0 7px; border-radius: 9px; background: rgba(255,255,255,0.06); font-size: 11px; color: {{ c.text2 }};">+{{ line.hidden }}</button>
                    </sc-if>
                    <sc-if value="{{ line.canStart }}" hint-placeholder-val="{{ false }}">
                      <span class="tbtn" style="height: 22px; margin-left: 4px; border-radius: 11px; display: inline-flex; align-items: center; font-size: 12px; color: {{ c.text3 }}; background: rgba(255,255,255,0.05);">
                        <button aria-label="Start a stopwatch on this line" onClick="{{ line.quickStart }}" style="height: 22px; padding: 0 8px 0 9px; display: flex; align-items: center; gap: 5px;">
                          <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
                          <span>Stopwatch</span>
                        </button>
                        <button aria-label="Countdown or enter time" onClick="{{ line.chipClick }}" style="height: 22px; padding: 0 7px; display: flex; align-items: center; box-shadow: inset 1px 0 0 rgba(255,255,255,0.08);">
                          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
                        </button>
                      </span>
                    </sc-if>
                  </div>
                </div>

                <sc-if value="{{ line.rowOpen }}" hint-placeholder-val="{{ false }}">
                  <div role="group" aria-label="Timer" style="margin: 4px 8px 10px {{ line.rowPad }}px; border-radius: 10px; background: {{ c.raised }}; overflow: hidden;">

                    <sc-if value="{{ rowActive }}" hint-placeholder-val="{{ true }}">
                      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 8px; padding: 14px 16px;">
                        <div style="display: flex; flex-direction: column; gap: 2px; margin-right: auto;">
                          <span style="font-size: 12px; color: {{ c.text3 }};">{{ rowMode }}</span>
                          <span class="mono" style="font-size: 28px; letter-spacing: -0.02em; color: {{ rowTimeColor }};">{{ rowTime }}</span>
                          <span style="font-size: 12px; color: {{ c.text2 }};">{{ rowSub }}</span>
                        </div>
                        <sc-if value="{{ rowIsCountdown }}" hint-placeholder-val="{{ false }}">
                          <button onClick="{{ extend5 }}" aria-label="Add five minutes to the countdown" class="mono" style="height: 34px; padding: 0 12px; border-radius: 8px; background: rgba(255,255,255,0.07); font-size: 12px;">+5m</button>
                        </sc-if>
                        <button onClick="{{ pauseResume }}" style="height: 34px; padding: 0 14px; border-radius: 8px; background: rgba(255,255,255,0.07); font-size: 13px;">{{ pauseLabel }}</button>
                        <button onClick="{{ stopAdd }}" style="height: 34px; padding: 0 14px; border-radius: 8px; background: {{ c.solid }}; color: {{ c.accentInk }}; font-weight: 600; font-size: 13px;">{{ stopAddLabel }}</button>
                        <sc-if value="{{ canReplace }}" hint-placeholder-val="{{ false }}">
                          <button onClick="{{ stopReplace }}" style="height: 34px; padding: 0 12px; border-radius: 8px; background: rgba(255,255,255,0.07); font-size: 13px;">{{ stopReplaceLabel }}</button>
                        </sc-if>
                        <button onClick="{{ discard }}" style="height: 34px; padding: 0 8px; border-radius: 8px; font-size: 13px; color: {{ c.text2 }};">Discard</button>
                      </div>
                      <sc-if value="{{ rowIsCountdown }}" hint-placeholder-val="{{ false }}">
                        <div style="height: 3px; background: rgba(255,255,255,0.05);"><div style="height: 3px; width: {{ rowPct }}%; background: {{ c.accent }};"></div></div>
                      </sc-if>
                    </sc-if>

                    <sc-if value="{{ rowIdle }}" hint-placeholder-val="{{ false }}">
                      <div style="padding: 12px 16px 0; font-size: 13px; color: {{ c.text2 }};">{{ rowLogged }}</div>
                      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px; padding: 10px;">
                        <div style="padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.035); display: flex; flex-direction: column; align-items: flex-start; gap: 10px;">
                          <span style="font-size: 13px; font-weight: 600;">Stopwatch</span>
                          <button onClick="{{ startStopwatch }}" style="height: 30px; padding: 0 14px; border-radius: 8px; background: {{ c.solid }}; color: {{ c.accentInk }}; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 7px;">
                            <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>{{ startLabel }}
                          </button>
                          <span style="font-size: 12px; line-height: 17px; color: {{ c.text3 }};">Counts up until you stop it.</span>
                        </div>
                        <div style="padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.035); display: flex; flex-direction: column; align-items: flex-start; gap: 10px;">
                          <span style="font-size: 13px; font-weight: 600;">Countdown</span>
                          <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                            <sc-for list="{{ presets }}" as="p" hint-placeholder-count="3">
                              <button onClick="{{ p.pick }}" aria-label="{{ p.aria }}" class="mono" style="height: 30px; padding: 0 10px; border-radius: 8px; font-size: 12px; background: rgba(255,255,255,0.07); color: {{ c.text }};">{{ p.label }}</button>
                            </sc-for>
                            <label for="cd-in" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Countdown length, press Enter to start</label>
                            <input id="cd-in" class="mono" value="{{ cdInput }}" onChange="{{ onCd }}" onKeyDown="{{ onCdKey }}" placeholder="1h 30m" style="width: 72px; height: 30px; box-sizing: border-box; padding: 0 9px; border: 0; border-radius: 8px; background: {{ c.bg }}; font-size: 12px;">
                          </div>
                          <span style="font-size: 12px; line-height: 17px; color: {{ c.text3 }};">Pick a length to start. At zero it notifies you and logs the time.</span>
                        </div>
                        <div style="padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.035); display: flex; flex-direction: column; align-items: flex-start; gap: 10px;">
                          <label for="log-in" style="font-size: 13px; font-weight: 600;">Enter time</label>
                          <input id="log-in" class="mono" value="{{ logInput }}" onChange="{{ onLog }}" onKeyDown="{{ onLogKey }}" placeholder="45m, 1h 20m" style="width: 100%; height: 30px; box-sizing: border-box; padding: 0 9px; border: 0; border-radius: 8px; background: {{ c.bg }}; font-size: 12px;">
                          <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                            <button onClick="{{ logAdd }}" style="height: 30px; padding: 0 12px; border-radius: 8px; background: rgba(255,255,255,0.07); font-size: 12px;">{{ logAddLabel }}</button>
                            <button onClick="{{ logSet }}" style="height: 30px; padding: 0 10px; border-radius: 8px; font-size: 12px; color: {{ c.text2 }};">{{ logSetLabel }}</button>
                          </div>
                        </div>
                      </div>
                      <sc-if value="{{ rowSwitchNote }}" hint-placeholder-val="{{ false }}">
                        <div style="padding: 0 16px 12px; font-size: 12px; color: {{ c.text2 }}; display: flex; align-items: center; gap: 8px;">
                          <span style="width: 6px; height: 6px; border-radius: 3px; background: {{ c.accent }};"></span>{{ rowSwitchText }}
                        </div>
                      </sc-if>
                    </sc-if>
                  </div>
                </sc-if>
              </sc-if>
            </div>
          </div>
        </sc-for>

        <div style="display: flex;">
          <span style="width: 96px; flex-shrink: 0;"></span>
          <div style="flex: 1; min-width: 0; position: relative; padding: 2px 8px 0 0;">
            <div style="display: flex; align-items: center; gap: 9px; min-height: 32px; padding: 0 8px;">
              <span style="width: 18px; display: flex; justify-content: center;"><span style="width: 5px; height: 5px; border-radius: 3px; background: {{ c.faint }};"></span></span>
              <label for="draft" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">New line</label>
              <input id="draft" value="{{ draft }}" onChange="{{ onDraft }}" onKeyDown="{{ onDraftKey }}" placeholder="{{ draftPlaceholder }}" style="flex: 1; height: 32px; border: 0; outline: none; background: transparent; font-size: 15px; color: {{ c.text }};">
            </div>
            <sc-if value="{{ slashOpen }}" hint-placeholder-val="{{ false }}">
              <div role="listbox" aria-label="Slash commands" style="position: absolute; left: 35px; top: 40px; z-index: 6; width: 420px; border-radius: 10px; background: {{ c.raised }}; box-shadow: 0 16px 40px rgba(0,0,0,0.55); overflow: hidden;">
                <div style="padding: 6px;">
                  <sc-for list="{{ slashItems }}" as="s" hint-placeholder-count="5">
                    <button role="option" aria-selected="{{ s.on }}" onClick="{{ s.pick }}" style="width: 100%; min-height: 34px; padding: 4px 10px; border-radius: 6px; display: flex; align-items: center; gap: 10px; background: {{ s.bg }};">
                      <span class="mono" style="font-size: 13px; color: {{ c.text }}; min-width: 64px;">/{{ s.name }}</span>
                      <span class="mono" style="font-size: 12px; color: {{ c.text3 }}; min-width: 54px;">{{ s.arg }}</span>
                      <span style="font-size: 13px; color: {{ c.text2 }}; flex: 1;">{{ s.desc }}</span>
                    </button>
                  </sc-for>
                </div>
                <div style="padding: 9px 16px 11px; font-size: 12px; background: rgba(0,0,0,0.14); color: {{ slashPreviewColor }};">{{ slashPreview }}</div>
              </div>
            </sc-if>
          </div>
        </div>
      </div>
    </main>

    <sc-if value="{{ panelOn }}" hint-placeholder-val="{{ true }}">
      <aside aria-label="Data" style="flex: 0 1 {{ ps.width }}; min-width: 280px; height: 100%; box-sizing: border-box; padding: {{ ps.outerPad }}; background: {{ c.bg }}; box-shadow: {{ ps.line }}; display: flex; flex-direction: column;">
       <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; background: {{ ps.innerBg }}; border-radius: {{ ps.radius }}; padding: {{ ps.innerPad }};">
        <sc-if value="{{ showTabs }}" hint-placeholder-val="{{ true }}">
        <div role="tablist" aria-label="Panel" style="display: flex; gap: 2px; padding: 5px 0 6px; margin-left: -8px;">
          <button role="tab" aria-selected="{{ isOverview }}" onClick="{{ showOverview }}" style="height: 30px; padding: 0 12px; border-radius: 8px; font-size: 13px; background: {{ ovBg }}; color: {{ ovColor }};">This page</button>
          <button role="tab" aria-selected="{{ isSearch }}" onClick="{{ showSearch }}" style="height: 30px; padding: 0 12px; border-radius: 8px; font-size: 13px; background: {{ seBg }}; color: {{ seColor }};">Search</button>
        </div>
        </sc-if>

        <sc-if value="{{ showSearchBox }}" hint-placeholder-val="{{ false }}">
          <div style="padding: {{ ps.searchPad }}; display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 8px; background: rgba(255,255,255,0.05);">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{ c.text3 }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
              <label for="sq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search all documents</label>
              <input id="sq" class="mono" value="{{ q }}" onChange="{{ onQ }}" placeholder="#tag status:unset has:timer age:7d" style="flex: 1; height: 32px; border: 0; outline: none; background: transparent; font-size: 12.5px;">
              <sc-if value="{{ hasQ }}" hint-placeholder-val="{{ false }}">
                <button aria-label="Clear search" onClick="{{ clearQ }}" style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; color: {{ c.text3 }};">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
                </button>
              </sc-if>
            </div>
            <sc-if value="{{ hasSuggest }}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                <sc-for list="{{ suggest }}" as="sg" hint-placeholder-count="3">
                  <button onClick="{{ sg.pick }}" class="mono" style="height: 24px; padding: 0 9px; border-radius: 12px; background: rgba(255,255,255,0.06); font-size: 11.5px; color: {{ c.text }};">{{ sg.label }} <span style="color: {{ c.text3 }}; font-family: system-ui, sans-serif;">{{ sg.desc }}</span></button>
                </sc-for>
              </div>
            </sc-if>
            <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center;">
              <span style="font-size: 12px; color: {{ c.text3 }}; margin-right: 2px;">Saved</span>
              <sc-for list="{{ saved }}" as="sv" hint-placeholder-count="3">
                <button onClick="{{ sv.pick }}" class="mono" style="height: 24px; padding: 0 9px; border-radius: 12px; font-size: 11px; background: {{ sv.bg }}; color: {{ sv.color }};">{{ sv.q }}</button>
              </sc-for>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ showOverviewBody }}" hint-placeholder-val="{{ true }}">
          <div style="flex: 1; overflow-y: auto; padding: 14px 4px 80px; display: flex; flex-direction: column; gap: 28px;">
            <sc-if value="{{ hasOutline }}" hint-placeholder-val="{{ true }}">
              <section style="display: flex; flex-direction: column; gap: 2px;">
                <h3 style="margin: 0 0 6px; font-size: 12px; font-weight: 600; color: {{ c.text3 }};">Outline</h3>
                <sc-for list="{{ outline }}" as="o" hint-placeholder-count="2">
                  <button class="hov" onClick="{{ o.go }}" style="height: 28px; margin: 0 -8px; padding: 0 8px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: {{ c.text }};">
                    <span>{{ o.text }}</span><span class="mono" style="font-size: 11px; color: {{ c.text3 }};">{{ o.count }}</span>
                  </button>
                </sc-for>
              </section>
            </sc-if>

            <section style="display: flex; flex-direction: column; gap: 20px;">
              <h3 style="margin: 0; font-size: 12px; font-weight: 600; color: {{ c.text3 }};">Tags on this page</h3>
              <sc-if value="{{ noAggs }}" hint-placeholder-val="{{ false }}">
                <p style="margin: 0; font-size: 13px; color: {{ c.text3 }};">No tags here yet. Add one with #.</p>
              </sc-if>
              <sc-for list="{{ aggs }}" as="g" hint-placeholder-count="3">
                <div style="display: flex; flex-direction: column; gap: 4px;">
                  <div style="display: flex; align-items: baseline; gap: 8px;">
                    <button class="seg mono" onClick="{{ g.search }}" style="font-size: 14px; color: {{ c.accent }};">{{ g.tag }}</button>
                    <span style="flex: 1;"></span>
                    <span class="mono" style="font-size: 12px; display: flex; gap: 8px;">
                      <sc-for list="{{ g.pageBits }}" as="pb" hint-placeholder-count="2"><span style="color: {{ pb.color }};">{{ pb.text }}</span></sc-for>
                    </span>
                  </div>
                  <div style="display: flex; align-items: baseline; gap: 8px; font-size: 13px; color: {{ c.text2 }};">
                    <span class="mono" style="color: {{ c.text }};">{{ g.time }}</span>
                    <span>{{ g.tasks }}</span>
                  </div>
                  <sc-if value="{{ g.hasPin }}" hint-placeholder-val="{{ false }}">
                    <div style="display: flex; gap: 6px; align-items: flex-start; margin-top: 2px; font-size: 13px; color: {{ c.text2 }}; line-height: 18px;">
                      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="{{ c.text3 }}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 4px; flex-shrink: 0;"><path d="M12 17v5"></path><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"></path></svg>
                      <span>{{ g.pin }}</span>
                    </div>
                  </sc-if>
                </div>
              </sc-for>
              <span style="font-size: 12px; color: {{ c.text3 }};">Right column: this page. Below the tag: all documents.</span>
            </section>
          </div>
        </sc-if>

        <sc-if value="{{ showResults }}" hint-placeholder-val="{{ false }}">
          <div style="flex: 1; overflow-y: auto; padding: 8px 4px 80px; display: flex; flex-direction: column; gap: 16px;">
            <div style="font-size: 12px; color: {{ c.text3 }};">{{ resultSummary }}</div>
            <sc-for list="{{ results }}" as="rg" hint-placeholder-count="2">
              <div style="display: flex; flex-direction: column; gap: 2px;">
                <div style="display: flex; align-items: baseline; gap: 8px; padding: 0 2px 4px;">
                  <span style="font-size: 13px; font-weight: 600; color: {{ c.text }};">{{ rg.doc }}</span>
                  <span style="font-size: 12px; color: {{ c.text3 }};">{{ rg.when }}</span>
                </div>
                <sc-for list="{{ rg.items }}" as="ri" hint-placeholder-count="2">
                  <button class="hov" onClick="{{ ri.go }}" style="min-height: 28px; padding: 3px 8px 3px {{ ri.pad }}px; border-radius: 6px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: {{ ri.color }};">
                    <span class="mono" style="width: 14px; font-size: 11px; color: {{ ri.glyphColor }}; text-align: center;">{{ ri.glyph }}</span>
                    <span style="flex: 1; text-decoration: {{ ri.deco }};">{{ ri.text }}</span>
                    <span class="mono" style="font-size: 11px; color: {{ c.text3 }};">{{ ri.meta }}</span>
                  </button>
                </sc-for>
              </div>
            </sc-for>
          </div>
        </sc-if>
       </div>
      </aside>
    </sc-if>
  </div>

  <div style="position: absolute; left: 16px; bottom: 16px; z-index: 8; display: flex; flex-direction: column; gap: 2px; padding: 6px; border-radius: 12px; background: {{ c.raised }}; box-shadow: 0 10px 30px rgba(0,0,0,0.45);">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px;">
      <span style="width: 64px; font-size: 11px; color: {{ c.text3 }}; padding: 0 6px;">Theme</span>
      <sc-for list="{{ themes }}" as="th" hint-placeholder-count="5">
        <button aria-pressed="{{ th.on }}" onClick="{{ th.pick }}" title="{{ th.src }}" style="height: 28px; padding: 0 9px 0 6px; border-radius: 8px; display: flex; align-items: center; gap: 7px; font-size: 12px; background: {{ th.bg }}; color: {{ th.color }};">
          <span style="width: 16px; height: 16px; border-radius: 5px; background: {{ th.swBg }}; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center;"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{ th.swAccent }};"></span></span>
          {{ th.name }}
        </button>
      </sc-for>
    </div>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px;">
      <span style="width: 64px; font-size: 11px; color: {{ c.text3 }}; padding: 0 6px;">Panel</span>
      <sc-for list="{{ panelStyles }}" as="pv" hint-placeholder-count="4">
        <button aria-pressed="{{ pv.on }}" onClick="{{ pv.pick }}" title="{{ pv.desc }}" style="height: 28px; padding: 0 10px; border-radius: 8px; font-size: 12px; background: {{ pv.bg }}; color: {{ pv.color }};">{{ pv.name }}</button>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{ palette }}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-label="Command palette" style="position: absolute; top: 56px; left: 50%; transform: translateX(-50%); width: min(600px, calc(100% - 32px)); border-radius: 12px; background: {{ c.raised }}; box-shadow: 0 24px 60px rgba(0,0,0,0.65); overflow: hidden; z-index: 10;">
      <div style="height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 16px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{ c.text3 }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <label for="pq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Command</label>
        <input id="pq" autoFocus="{{ yes }}" value="{{ palQ }}" onChange="{{ onPalQ }}" onKeyDown="{{ onPalKey }}" placeholder="Run a command or open a document" style="flex: 1; height: 40px; border: 0; background: transparent; outline: none; font-size: 15px;">
        <button aria-label="Close" onClick="{{ closePalette }}" class="mono" style="font-size: 11px; color: {{ c.text3 }};">esc</button>
      </div>
      <div style="padding: 0 6px 6px; max-height: 420px; overflow-y: auto;">
        <sc-for list="{{ palItems }}" as="it" hint-placeholder-count="8">
          <sc-if value="{{ it.isHeader }}" hint-placeholder-val="{{ false }}">
            <div style="padding: 10px 10px 4px; font-size: 11px; color: {{ c.text3 }};">{{ it.label }}</div>
          </sc-if>
          <sc-if value="{{ it.isItem }}" hint-placeholder-val="{{ true }}">
            <button onClick="{{ it.run }}" style="width: 100%; height: 34px; padding: 0 10px; border-radius: 7px; display: flex; align-items: center; gap: 10px; font-size: 14px; background: {{ it.bg }};">
              <span>{{ it.label }}</span>
              <span style="font-size: 12px; color: {{ c.text3 }}; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">{{ it.sub }}</span>
              <span class="mono" style="font-size: 11px; color: {{ c.text3 }};">{{ it.hint }}</span>
            </button>
          </sc-if>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 12; padding: 10px 16px; border-radius: 10px; background: {{ c.raised }}; box-shadow: 0 12px 34px rgba(0,0,0,0.6); font-size: 13px; display: flex; align-items: center; gap: 14px;">
      <span>{{ toast }}</span>
      <sc-if value="{{ hasToastAction }}" hint-placeholder-val="{{ false }}"><button onClick="{{ toastRun }}" style="font-size: 13px; font-weight: 600; color: {{ c.accent }};">{{ toastLabel }}</button></sc-if>
    </div>
  </sc-if>
</div>
</template>

    const s = String(str || '').trim().toLowerCase();
    let m;
    if ((m = s.match(/^(\d+)\s*h(?:\s*(\d+)\s*m?)?$/))) return (+m[1]) * 3600 + (+(m[2] || 0)) * 60;
    if ((m = s.match(/^(\d+)\s*m(?:in)?$/))) return (+m[1]) * 60;
    if ((m = s.match(/^(\d+):(\d{1,2})$/))) return (+m[1]) * 3600 + (+m[2]) * 60;
    if ((m = s.match(/^(\d+)$/))) return (+m[1]) * 60;
    return null;
  }
  dateFor(off) { return new Date(2026, 9, 11 + off); }
  dateTitle(off) { return this.dateFor(off).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }); }
  dateKey(off) { const d = this.dateFor(off); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  // ---- documents -----------------------------------------------------------
  key() { return this.state.doc === 'roadmap' ? 'roadmap' : 'd' + this.state.day; }
  docLines(key) {
    const base = key === 'roadmap' ? ROADMAP : key === 'd0' ? TODAY : [];
    return base.concat(this.state.extra[key] || []);
  }
  everyLine() {
    let out = TODAY.concat(ROADMAP);
    Object.keys(this.state.extra).forEach((k) => { out = out.concat(this.state.extra[k]); });
    return out;
  }
  name(id) {
    const l = this.everyLine().find((x) => x.id === id);
    if (!l) return '';
    return l.head ? l.text : l.segs.filter((s) => !s.tag).map((s) => s.t || s.c || s.l).join(' ');
  }
  navTo(key) { return key === 'roadmap' ? { doc: 'roadmap' } : { doc: 'date', day: parseInt(key.slice(1), 10) }; }
  tagsFor(idx, lines) {
    const out = new Set();
    let indent = lines[idx].indent + 1;
    for (let i = idx; i >= 0; i--) {
      if (lines[i].indent < indent) {
        (lines[i].segs || []).forEach((s) => s.tag && out.add(s.tag));
        indent = lines[i].indent;
      }
    }
    return Array.from(out);
  }
  say(msg, action, ms) {
    clearTimeout(this.tt);
    this.setState({ toast: msg, toastAction: action || null });
    this.tt = setTimeout(() => this.setState({ toast: null, toastAction: null }), ms || 5000);
  }

  // ---- timer: one global timer, optional end time ---------------------------
  // A timer always counts the session. Giving it an end time makes the chip
  // count down to that point; reaching it logs the time and tells you.
  start(id, mode, target, keepOpen) {
    const S = this.state;
    const now = Date.now();
    const prev = S.timer;
    let times = S.times;
    if (prev && prev.line !== id) {
      const secs = this.elapsed(prev, now);
      times = Object.assign({}, S.times, { [prev.line]: (S.times[prev.line] || 0) + secs });
      const before = { times: S.times, timer: prev };
      this.say('Stopped “' + this.name(prev.line) + '” and logged ' + this.clock(secs), { label: 'Undo', apply: () => this.setState(before) });
    }
    this.setState({ times: times, timer: { line: id, docKey: this.key(), mode: mode, since: now, acc: 0, paused: false, target: target || 0 }, now: now, cur: id, open: keepOpen ? id : null, cdInput: '' });
  }
  extend(secs) {
    const t = this.state.timer;
    if (t) this.setState({ timer: Object.assign({}, t, { target: t.target + secs }) });
  }
  pauseResume() {
    const t = this.state.timer;
    if (!t) return;
    const now = Date.now();
    this.setState({ timer: t.paused ? Object.assign({}, t, { paused: false, since: now }) : Object.assign({}, t, { paused: true, acc: this.elapsed(t, now) }), now: now });
  }
  stopAndLog(replace) {
    const S = this.state;
    const t = S.timer;
    if (!t) return;
    const secs = this.elapsed(t);
    const before = { times: S.times, timer: t };
    this.setState({ times: Object.assign({}, S.times, { [t.line]: replace ? secs : (S.times[t.line] || 0) + secs }), timer: null, open: null });
    this.say((replace ? 'Set “' + this.name(t.line) + '” to ' + this.clock(secs) : 'Added ' + this.clock(secs) + ' to “' + this.name(t.line) + '”'), { label: 'Undo', apply: () => this.setState(before) });
  }
  // Countdown reached zero: Tekne plays a sound, sends a notification and
  // completes the timer, logging the target length.
  finish(t) {
    const S = this.state;
    const secs = t.target;
    const before = { times: S.times };
    this.setState({ times: Object.assign({}, S.times, { [t.line]: (S.times[t.line] || 0) + secs }), timer: null, open: null, now: Date.now() });
    this.say('Countdown finished. Added ' + this.dur(secs) + ' to “' + this.name(t.line) + '”', { label: 'Undo', apply: () => this.setState(before) }, 8000);
  }
  discard() {
    const t = this.state.timer;
    if (!t) return;
    this.setState({ timer: null, open: null });
    this.say('Discarded ' + this.clock(this.elapsed(t)) + ' on “' + this.name(t.line) + '”', { label: 'Undo', apply: () => this.setState({ timer: t }) });
  }
  log(id, secs, replace) {
    const S = this.state;
    const before = { times: S.times };
    this.setState({ times: Object.assign({}, S.times, { [id]: replace ? secs : (S.times[id] || 0) + secs }), logInput: '', open: null });
    this.say((replace ? 'Set ' : 'Added ') + this.dur(secs) + (replace ? ' as the total on “' : ' to “') + this.name(id) + '”', { label: 'Undo', apply: () => this.setState(before) });
  }
  toggleTask(id) {
    const cur = this.state.tasks[id];
    this.setState({ tasks: Object.assign({}, this.state.tasks, { [id]: cur === 'unset' ? 'complete' : 'unset' }), cur: id });
  }
  setTask(id, v) {
    const tasks = Object.assign({}, this.state.tasks);
    if (v === null) delete tasks[id]; else tasks[id] = v;
    this.setState({ tasks: tasks });
  }

  // ---- slash commands --------------------------------------------------------
  slashState() {
    const d = this.state.draft;
    const m = d.match(/(?:^|\s)\/(\w*)(?:\s+(\S*))?$/);
    if (!m) return null;
    const word = m[1].toLowerCase();
    const before = d.slice(0, m.index).trim();
    const exact = SLASH.find((c) => c.name === word);
    const list = exact && m[2] !== undefined ? [exact] : SLASH.filter((c) => c.name.startsWith(word));
    return { word: word, arg: m[2] || '', before: before, list: list, hasArg: m[2] !== undefined };
  }
  commitDraft(cmdName) {
    const S = this.state;
    const st = this.slashState();
    let text = S.draft.trim();
    let cmd = null, arg = '';
    if (st && st.list.length) {
      cmd = cmdName ? SLASH.find((c) => c.name === cmdName) : st.list[Math.min(S.slashIdx, st.list.length - 1)];
      arg = st.arg;
      text = st.before;
      if (cmd && cmd.arg && !cmd.optional && !arg && !st.hasArg) {
        this.setState({ draft: (st.before ? st.before + ' ' : '') + '/' + cmd.name + ' ', slashIdx: 0 });
        return;
      }
    }
    if (cmd && cmd.name === 'date') { this.setState({ draft: (st.before ? st.before + ' ' : '') + this.dateKey(S.day) + ' ', slashIdx: 0 }); return; }
    if (!text) { this.say('Type the line first, then the command'); return; }
    const key = this.key();
    const existing = S.extra[key] || [];
    const id = 'n' + key + '-' + (existing.length + 1);
    const segs = [];
    text.split(/\s+/).forEach((w) => {
      if (/^#[a-z][\w/-]*$/i.test(w)) segs.push({ tag: w.slice(1).toLowerCase() });
      else if (segs.length && segs[segs.length - 1].t !== undefined) segs[segs.length - 1].t += ' ' + w;
      else segs.push({ t: w });
    });
    const first = this.docLines(key).length === 0;
    const nowStr = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    const line = { id: id, indent: 0, segs: segs, ts: first ? this.dateFor(S.day).toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' }) + ' ' + nowStr : (existing.length ? '' : nowStr) };
    this.setState({ extra: Object.assign({}, S.extra, { [key]: existing.concat([line]) }), draft: '', slashIdx: 0, cur: id });
    if (!cmd) return;
    const secs = this.parse(arg);
    if (cmd.name === 'task') this.setState({ tasks: Object.assign({}, S.tasks, { [id]: 'unset' }) });
    if (cmd.name === 'stopwatch') this.start(id, 'stopwatch', 0);
    if (cmd.name === 'countdown' && secs) this.start(id, 'countdown', secs);
    if (cmd.name === 'log' && secs) this.setState({ times: Object.assign({}, S.times, { [id]: secs }) });
    if (cmd.name === 'pin') this.setState({ pins: Object.assign({}, S.pins, { [id]: true }) });
  }

  // ---- search ----------------------------------------------------------------
  searchResults() {
    const S = this.state;
    const toks = S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    if (!toks.length) return null;
    const live = (key, doc, when) => {
      const lines = this.docLines(key);
      const out = { key: key, doc: doc, when: when, lines: [] };
      lines.forEach((l, i) => {
        if (l.head) return;
        out.lines.push({ id: l.id, indent: l.indent, text: this.name(l.id), tags: this.tagsFor(i, lines), task: S.tasks[l.id],
          time: (S.times[l.id] || 0) + (S.timer && S.timer.line === l.id ? this.elapsed() : 0), pinned: !!S.pins[l.id] });
      });
      return out;
    };
    let groups = [live('d0', this.dateKey(0), 'today'), live('roadmap', 'Tekne roadmap', 'edited yesterday')];
    if (this.key() === 'roadmap') groups.reverse();
    groups = groups.concat(CORPUS);
    const statusAlias = { done: 'complete', open: 'unset', cancelled: 'incomplete' };
    const match = (g, l) => toks.every((tk) => {
      if (tk.startsWith('#')) return l.tags.some((t) => t.startsWith(tk.slice(1)));
      if (tk.startsWith('status:')) { const v = tk.slice(7); return l.task && l.task === (statusAlias[v] || v); }
      if (tk === 'has:timer') return (l.time || 0) > 0;
      if (tk === 'has:task') return !!l.task;
      if (tk === 'has:pin') return !!l.pinned;
      if (tk.startsWith('has:')) return true;
      if (tk.startsWith('age:')) { const n = parseInt(tk.slice(4), 10) || 0; return g.when !== 'template' && (g.when !== 'last week' || n >= 7); }
      if (tk.startsWith('doc:')) return g.doc.toLowerCase().includes(tk.slice(4));
      return l.text.toLowerCase().includes(tk);
    });
    return groups.map((g) => ({ g: g, hits: g.lines.filter((l) => match(g, l)) })).filter((x) => x.hits.length);
  }

  // ---- render ----------------------------------------------------------------
  renderVals() {
    const S = this.state;
    const themeKey = THEMES[S.theme || this.props.theme] ? (S.theme || this.props.theme) : 'neutralBlue';
    const c = Object.assign({ head: THEMES[themeKey].text }, THEMES[themeKey]);
    const psKey = S.panelStyle;
    const P = PANEL_STYLES[psKey];
    const T = S.timer;
    const key = this.key();
    const lines = this.docLines(key);
    const isDateDoc = S.doc === 'date';

    // visibility and structure
    const visible = [];
    let hideBelow = null;
    lines.forEach((l, i) => {
      if (hideBelow !== null && l.indent > hideBelow) return;
      hideBelow = null;
      const next = lines[i + 1];
      const hasKids = !!next && next.indent > l.indent;
      let hidden = 0;
      if (hasKids) for (let j = i + 1; j < lines.length && lines[j].indent > l.indent; j++) hidden++;
      if (S.collapsed[l.id] && hasKids) hideBelow = l.indent;
      visible.push({ l: l, hasKids: hasKids, hidden: hidden });
    });

    const vlines = visible.map((v) => {
      const l = v.l;
      const pad = 8 + l.indent * 24;
      const ts = l.ts || '';
      if (l.head) return { id: l.id, isHead: true, isLine: false, text: l.text, pad: pad + 1, ts: ts, tsPad: 28 };
      const task = S.tasks[l.id];
      const collapsed = !!S.collapsed[l.id] && v.hasKids;
      const pinned = !!S.pins[l.id];
      const isT = !!T && T.line === l.id;
      const logged = S.times[l.id] || 0;
      const done = task === 'complete', cancelled = task === 'incomplete';
      let chipText = '', chipBg = 'transparent', chipColor = c.text2;
      if (isT) {
        chipText = T.mode === 'countdown' ? this.clock(T.target - this.elapsed()) + ' left' : this.clock(logged + this.elapsed());
        chipColor = T.paused ? c.text2 : c.accent;
        chipBg = T.paused ? 'rgba(255,255,255,0.07)' : c.accentSoft;
      } else if (logged) chipText = this.dur(logged);
      const toggleCollapse = () => this.setState({ collapsed: Object.assign({}, S.collapsed, { [l.id]: !S.collapsed[l.id] }) });
      const select = () => this.setState({ cur: l.id });
      const hasChip = isT || logged > 0;
      return {
        id: l.id, isHead: false, isLine: true, pad: pad, rowPad: pad + 27, ts: ts, tsPad: 7,
        rowBg: S.cur === l.id ? c.sel : 'transparent',
        gTask: !!task, gPin: !task && pinned, gDot: !task && !pinned,
        pinTrail: !!task && pinned,
        halo: collapsed ? 'rgba(255,255,255,0.10)' : 'transparent',
        dotColor: collapsed ? c.text : c.faint,
        glyphLabel: task ? (done ? 'Mark open' : cancelled ? 'Reopen cancelled task' : 'Mark done') : (v.hasKids ? (collapsed ? 'Expand' : 'Collapse') : 'Line'),
        glyphClick: task ? () => (cancelled ? this.setTask(l.id, 'unset') : this.toggleTask(l.id)) : (v.hasKids ? toggleCollapse : select),
        isDone: done, isCancelled: cancelled,
        boxBorder: done ? c.solid : cancelled ? c.faint : c.text3,
        boxBg: done ? c.solid : 'transparent',
        textColor: done || cancelled ? c.text3 : c.text,
        deco: cancelled ? 'line-through' : 'none',
        segs: l.segs.map((s) => ({
          isText: s.t !== undefined, isTag: !!s.tag, isLink: !!s.l, isCode: !!s.c,
          text: s.t || s.c || s.l || ('#' + s.tag),
          click: s.tag ? () => this.setState({ panelOn: true, panel: 'search', q: '#' + s.tag + ' ' })
            : s.go ? () => this.setState(Object.assign(this.navTo(s.go), { cur: null, open: null }))
            : s.l ? () => this.say('Opening ' + s.l + ' is not in this prototype')
            : select
        })),
        hasChip: hasChip,
        chipText: chipText, chipBg: chipBg, chipColor: chipColor,
        chipLive: isT && !T.paused, chipPaused: isT && T.paused, chipIdle: !isT,
        chipLabel: isT ? 'Timer: ' + chipText + '. Open timer controls' : this.dur(logged) + ' logged. Open timer controls',
        rowOpen: S.open === l.id,
        chipClick: () => this.setState({ open: S.open === l.id ? null : l.id, cur: l.id, logInput: '', cdInput: '' }),
        canStart: !hasChip,
        quickStart: () => this.start(l.id, 'stopwatch', 0, false),
        isCollapsed: collapsed, hidden: v.hidden, hiddenLabel: 'Show ' + v.hidden + ' hidden lines',
        expand: toggleCollapse
      };
    });

    // timer row
    const openId = S.open;
    const rowActive = !!T && T.line === openId;
    const otherRunning = !!T && T.line !== openId;
    const openLogged = openId ? S.times[openId] || 0 : 0;
    const el = T ? this.elapsed() : 0;
    const cdSecs = this.parse(S.cdInput);
    const logSecs = this.parse(S.logInput);
    let rowSub = '';
    const isCd = rowActive && T.mode === 'countdown';
    if (rowActive) {
      const bits = [];
      if (isCd) {
        const ends = new Date(S.now + (T.target - el) * 1000).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        bits.push(T.paused ? 'Paused' : 'Ends at ' + ends + ', then notifies you and adds ' + this.dur(T.target));
      } else bits.push(T.paused ? 'Paused' : 'This session');
      if (openLogged) bits.push(this.dur(openLogged) + ' logged before');
      rowSub = bits.join(' · ');
    }
    // header meta
    const content = lines.filter((l) => !l.head);
    const openCount = content.filter((l) => S.tasks[l.id] === 'unset').length;
    const logged = content.reduce((a, l) => a + (S.times[l.id] || 0) + (T && T.line === l.id ? el : 0), 0);
    const metaBits = [];
    if (!isDateDoc) metaBits.push('Edited yesterday');
    else metaBits.push(this.dateFor(S.day).toLocaleDateString('en-GB', { weekday: 'long' }));
    if (content.length) {
      metaBits.push(content.length + (content.length === 1 ? ' line' : ' lines'));
      if (openCount) metaBits.push(openCount + ' open');
      if (logged) metaBits.push(this.dur(logged) + ' logged');
    } else metaBits.push('Nothing written yet');

    // aggregate (no charts)
    const pageAgg = {};
    lines.forEach((l, i) => {
      if (l.head) return;
      this.tagsFor(i, lines).forEach((tag) => {
        const a = pageAgg[tag] || (pageAgg[tag] = { done: 0, open: 0, cancelled: 0, time: 0, pin: null });
        const tk = S.tasks[l.id];
        if (tk === 'complete') a.done++;
        if (tk === 'unset') a.open++;
        if (tk === 'incomplete') a.cancelled++;
        a.time += (S.times[l.id] || 0) + (T && T.line === l.id ? el : 0);
        if (S.pins[l.id] && !a.pin) a.pin = this.name(l.id);
      });
    });
    const runIdx = T ? lines.findIndex((l) => l.id === T.line) : -1;
    const liveTags = runIdx >= 0 ? this.tagsFor(runIdx, lines) : [];
    const aggs = Object.keys(pageAgg).sort().map((tag) => {
      const p = pageAgg[tag];
      const base = ALLTIME[tag] || { done: 0, open: 0, cancelled: 0, time: 0 };
      const live = liveTags.includes(tag);
      const parts = [];
      if (p.time) parts.push({ text: '+' + this.dur(p.time), color: live ? c.accent : c.text2 });
      if (p.done) parts.push({ text: '+' + p.done + ' done', color: c.done });
      if (p.open) parts.push({ text: p.open + ' open', color: c.text3 });
      if (!parts.length) parts.push({ text: '—', color: c.text3 });
      const taskBits = [(base.done + p.done) + ' done', (base.open + p.open) + ' open'];
      if (base.cancelled + p.cancelled) taskBits.push((base.cancelled + p.cancelled) + ' cancelled');
      const total = base.time + p.time;
      return {
        tag: '#' + tag,
        pageBits: parts,
        time: total ? this.dur(total) : 'no time',
        tasks: taskBits.join(' · '),
        hasPin: !!p.pin, pin: p.pin || '',
        search: () => this.setState({ panel: 'search', q: '#' + tag + ' ', panelOn: true })
      };
    });

    const outline = [];
    lines.forEach((l, i) => {
      if (!l.head) return;
      let n = 0;
      for (let j = i + 1; j < lines.length && !lines[j].head; j++) n++;
      outline.push({ text: l.text, count: String(n), go: () => this.setState({ cur: (lines[i + 1] || l).id }) });
    });

    // search
    const res = this.searchResults();
    const glyphFor = (l) => l.task === 'complete' ? '✓' : l.task === 'incomplete' ? '–' : l.task === 'unset' ? '○' : l.pinned ? '⌖' : '•';
    const results = (res || []).map((x) => ({
      doc: x.g.doc, when: x.g.when,
      items: x.hits.map((l) => ({
        text: l.text, pad: 8 + (l.indent || 0) * 14,
        glyph: glyphFor(l), glyphColor: l.task === 'complete' ? c.text2 : c.text3,
        color: l.task === 'complete' || l.task === 'incomplete' ? c.text2 : c.text,
        deco: l.task === 'incomplete' ? 'line-through' : 'none',
        meta: [l.time ? this.dur(l.time) : '', (l.tags || []).map((t) => '#' + t).join(' ')].filter(Boolean).join('  '),
        go: () => (l.id ? this.setState(Object.assign(this.navTo(x.g.key), { cur: l.id })) : this.say('Opening ' + x.g.doc + ' is not in this prototype'))
      }))
    }));
    const nHits = (res || []).reduce((a, x) => a + x.hits.length, 0);
    const lastTok = S.q.split(/\s+/).pop() || '';
    const suggest = OPERATORS.filter((o) => lastTok && o.k.startsWith(lastTok) && o.k !== lastTok).concat(
      lastTok === 'has:' ? ['timer', 'task', 'pin'].map((v) => ({ k: 'has:' + v, desc: '' })) :
      lastTok === 'status:' ? ['complete', 'incomplete', 'unset'].map((v) => ({ k: 'status:' + v, desc: '' })) : []
    ).slice(0, 5).map((o) => ({ label: o.k, desc: o.desc, pick: () => this.setState({ q: S.q.slice(0, S.q.length - lastTok.length) + o.k + (o.k.endsWith(':') || o.k === '#' ? '' : ' ') }) }));

    // slash menu
    const sl = this.slashState();
    const slashOpen = !!sl && sl.list.length > 0;
    const si = sl ? Math.min(S.slashIdx, Math.max(0, sl.list.length - 1)) : 0;
    let slashPreview = '', slashPreviewColor = c.text3;
    if (slashOpen) {
      const cm = sl.list[si];
      const secs = this.parse(sl.arg);
      const target = sl.before ? '“' + sl.before + '”' : 'the new line';
      if (cm.name === 'stopwatch') slashPreview = '↵ adds ' + target + ' and starts a stopwatch';
      else if (cm.name === 'countdown') slashPreview = secs ? '↵ adds ' + target + ' and starts a ' + this.clock(secs) + ' countdown' : 'Type a length, e.g. /countdown 25m';
      else if (cm.name === 'log') slashPreview = secs ? '↵ adds ' + target + ' with ' + this.dur(secs) + ' logged' : 'Type how long, e.g. /log 45m';
      else if (cm.name === 'task') slashPreview = '↵ adds ' + target + ' as an open task';
      else if (cm.name === 'pin') slashPreview = '↵ adds ' + target + ' pinned to its tag summary';
      else slashPreview = '↵ inserts ' + this.dateKey(S.day);
      if (T && (cm.name === 'stopwatch' || (cm.name === 'countdown' && secs))) slashPreview += '. Stops “' + this.name(T.line) + '” first';
      if (secs || (cm.name !== 'log' && cm.name !== 'countdown')) slashPreviewColor = c.text2;
    }

    // palette
    const cur = S.cur, curT = cur ? S.tasks[cur] : null, curName = cur ? this.name(cur) : '';
    const close = { palette: false, palQ: '', palIdx: 0 };
    const run = (fn) => () => { this.setState(close); fn(); };
    const lineCmds = cur ? [
      { g: 'This line', label: T && T.line === cur ? (T.paused ? 'Resume timer' : 'Pause timer') : 'Start stopwatch', hint: '⌥T', run: run(() => (T && T.line === cur ? this.pauseResume() : this.start(cur, 'stopwatch', 0, false))) },
      { g: 'This line', label: 'Countdown…', sub: '15m, 25m, 50m or any length', hint: '⌥⇧T', run: run(() => this.setState({ open: cur })) },
      { g: 'This line', label: 'Enter time…', sub: 'add or set the total', hint: '', run: run(() => this.setState({ open: cur })) },
      { g: 'This line', label: curT ? (curT === 'complete' ? 'Mark open' : 'Mark done') : 'Make a task', hint: '⌥C', run: run(() => (curT ? this.toggleTask(cur) : this.setTask(cur, 'unset'))) },
      { g: 'This line', label: 'Cancel task', hint: '⌥X', run: run(() => this.setTask(cur, 'incomplete')) },
      { g: 'This line', label: S.pins[cur] ? 'Unpin' : 'Pin to tag summary', hint: '⌥P', run: run(() => this.setState({ pins: Object.assign({}, S.pins, { [cur]: !S.pins[cur] }) })) },
      { g: 'This line', label: S.collapsed[cur] ? 'Expand' : 'Collapse', hint: '⌘.', run: run(() => this.setState({ collapsed: Object.assign({}, S.collapsed, { [cur]: !S.collapsed[cur] }) })) }
    ] : [];
    const cmds = lineCmds.concat([
      { g: 'Go to', label: 'Today', sub: this.dateKey(0), hint: '', run: run(() => this.setState({ doc: 'date', day: 0, cur: null, open: null })) },
      { g: 'Go to', label: 'Yesterday', sub: this.dateKey(-1), hint: '', run: run(() => this.setState({ doc: 'date', day: -1, cur: null, open: null })) },
      { g: 'Go to', label: 'Tekne roadmap', sub: 'document', hint: '', run: run(() => this.setState({ doc: 'roadmap', cur: null, open: null })) },
      { g: 'Go to', label: 'WeeklyReview', sub: 'document', hint: '' },
      { g: 'Go to', label: 'Line…', sub: 'by number', hint: '⌘G' },
      { g: 'Panel', label: 'Search all documents', hint: '⌘⇧F', run: run(() => this.setState({ panelOn: true, panel: 'search' })) },
      { g: 'Panel', label: S.panelOn ? 'Hide panel' : 'Show panel', hint: '⌘B', run: run(() => this.setState({ panelOn: !S.panelOn })) },
      { g: 'Tools', label: 'Cancel old open tasks…', sub: 'preview before applying', hint: '' },
      { g: 'Tools', label: 'Rename tag…', hint: '' },
      { g: 'Tools', label: 'New document from template…', hint: '' },
      { g: 'Help', label: 'Open the tutorial', hint: '' },
      { g: 'Help', label: 'Keyboard shortcuts', hint: '?' }
    ]).concat(THEME_ORDER.map((k) => ({ g: 'Mockup theme', label: THEMES[k].name, sub: k === themeKey ? 'current' : '', hint: '', run: run(() => this.setState({ theme: k })) })))
      .map((cm) => Object.assign({ run: run(() => this.say(cm.label.replace('…', '') + ' is not in this prototype')) }, cm));
    const pq = S.palQ.trim().toLowerCase();
    const palHits = cmds.filter((cm) => !pq || (cm.label + ' ' + (cm.sub || '') + ' ' + cm.g).toLowerCase().includes(pq));
    const pi = Math.min(S.palIdx, Math.max(0, palHits.length - 1));
    const palItems = [];
    let lastG = null;
    palHits.forEach((cm, i) => {
      if (cm.g !== lastG) { palItems.push({ isHeader: true, isItem: false, label: cm.g === 'This line' ? 'This line · ' + curName : cm.g }); lastG = cm.g; }
      palItems.push({ isHeader: false, isItem: true, label: cm.label, sub: cm.sub || '', hint: cm.hint || '', run: cm.run, bg: i === pi ? 'rgba(255,255,255,0.07)' : 'transparent' });
    });

    const tabOn = 'rgba(255,255,255,0.07)';
    return {
      c: c, yes: true,
      themes: THEME_ORDER.map((k) => ({ name: THEMES[k].name, src: THEMES[k].src, on: k === themeKey, swBg: THEMES[k].bg, swAccent: THEMES[k].accent,
        bg: k === themeKey ? 'rgba(255,255,255,0.09)' : 'transparent', color: k === themeKey ? c.text : c.text2, pick: () => this.setState({ theme: k }) })),

      title: isDateDoc ? this.dateKey(S.day) : 'Tekne roadmap',
      isDateDoc: isDateDoc, notToday: isDateDoc && S.day !== 0,
      prevDay: () => this.setState({ day: S.day - 1, cur: null, open: null }),
      nextDay: () => this.setState({ day: S.day + 1, cur: null, open: null }),
      goToday: () => this.setState({ day: 0, cur: null, open: null }),
      meta: metaBits.join(' · '),
      lines: vlines,

      hasTimer: !!T,
      headChipTime: T ? (T.mode === 'countdown' ? this.clock(T.target - el) + ' left' : this.clock((S.times[T.line] || 0) + el)) : '',
      headChipColor: T && T.paused ? c.text2 : c.accent,
      headChipBg: T && T.paused ? 'rgba(255,255,255,0.07)' : c.accentSoft,
      headDotClass: T && !T.paused ? 'pulse' : '',
      timerLineName: T ? this.name(T.line) : '',
      jumpToTimer: () => T && this.setState(Object.assign(this.navTo(T.docKey), { cur: T.line, open: T.line })),
      openPalette: () => this.setState({ palette: true, palQ: '', palIdx: 0 }),
      panelOn: S.panelOn,
      ps: { width: P.width, outerPad: P.outerPad, line: P.line, innerBg: P.innerBg, radius: P.radius, innerPad: P.innerPad, searchPad: P.tabs ? '10px 4px 12px' : '2px 4px 12px' },
      showTabs: P.tabs,
      showSearchBox: P.tabs ? S.panel === 'search' : true,
      showOverviewBody: P.tabs ? S.panel === 'overview' : !S.q.trim(),
      showResults: P.tabs ? S.panel === 'search' : !!S.q.trim(),
      panelStyles: PANEL_ORDER.map((k) => ({ name: PANEL_STYLES[k].name, desc: PANEL_STYLES[k].desc, on: k === psKey,
        bg: k === psKey ? 'rgba(255,255,255,0.09)' : 'transparent', color: k === psKey ? c.text : c.text2, pick: () => this.setState({ panelStyle: k, panelOn: true }) })),
      togglePanel: () => this.setState({ panelOn: !S.panelOn }),
      panelIconColor: S.panelOn ? c.text : c.text3,

      rowActive: rowActive, rowIdle: !!openId && !rowActive,
      rowMode: rowActive ? (isCd ? 'Countdown · ' + this.dur(T.target) : 'Stopwatch') : '',
      rowTime: rowActive ? (isCd ? this.clock(T.target - el) : this.clock(el)) : '',
      rowTimeColor: rowActive && T.paused ? c.text2 : c.head,
      rowSub: rowSub,
      rowIsCountdown: isCd,
      rowPct: isCd ? Math.min(100, Math.round((el / T.target) * 100)) : 0,
      extend5: () => this.extend(300),
      pauseLabel: T && T.paused ? 'Resume' : 'Pause',
      pauseResume: () => this.pauseResume(),
      stopAdd: () => this.stopAndLog(false),
      stopAddLabel: rowActive ? (openLogged ? 'Stop · add ' + this.clock(el) : 'Stop · log ' + this.clock(el)) : '',
      canReplace: rowActive && openLogged > 0,
      stopReplace: () => this.stopAndLog(true),
      stopReplaceLabel: 'Stop · replace ' + this.dur(openLogged),
      discard: () => this.discard(),
      presets: PRESETS.map((p) => ({ label: p, aria: 'Start a ' + p + ' countdown', pick: () => this.start(openId, 'countdown', this.parse(p), true) })),
      cdInput: S.cdInput,
      onCd: (e) => this.setState({ cdInput: e.target.value }),
      onCdKey: (e) => { if (e.key === 'Enter' && cdSecs) this.start(openId, 'countdown', cdSecs, true); if (e.key === 'Escape') this.setState({ open: null }); },
      rowLogged: openLogged ? this.dur(openLogged) + ' logged on this line' : 'Nothing logged on this line yet',
      startLabel: otherRunning ? 'Switch here' : 'Start',
      startStopwatch: () => this.start(openId, 'stopwatch', 0, true),
      logInput: S.logInput,
      onLog: (e) => this.setState({ logInput: e.target.value }),
      onLogKey: (e) => { if (e.key === 'Enter' && logSecs) this.log(openId, logSecs, false); },
      logAddLabel: logSecs ? 'Add ' + this.dur(logSecs) : 'Add',
      logSetLabel: logSecs ? 'Set total to ' + this.dur(logSecs) : 'Set total',
      logAdd: () => logSecs && this.log(openId, logSecs, false),
      logSet: () => logSecs && this.log(openId, logSecs, true),
      rowSwitchNote: otherRunning,
      rowSwitchText: otherRunning ? 'Starting here stops “' + this.name(T.line) + '” and logs its ' + this.clock(el) + '.' : '',

      draft: S.draft,
      draftPlaceholder: content.length ? 'New line. Try: Draft release notes #tekne /countdown 25m' : 'Start writing. Try: Plan the week /stopwatch',
      onDraft: (e) => this.setState({ draft: e.target.value, slashIdx: 0 }),
      onDraftKey: (e) => {
        if (slashOpen && e.key === 'ArrowDown') { e.preventDefault(); this.setState({ slashIdx: (si + 1) % sl.list.length }); }
        else if (slashOpen && e.key === 'ArrowUp') { e.preventDefault(); this.setState({ slashIdx: (si - 1 + sl.list.length) % sl.list.length }); }
        else if (slashOpen && e.key === 'Tab') { e.preventDefault(); const cm = sl.list[si]; this.setState({ draft: (sl.before ? sl.before + ' ' : '') + '/' + cm.name + ' ' + (sl.arg || '') }); }
        else if (e.key === 'Enter') { e.preventDefault(); this.commitDraft(); }
        else if (e.key === 'Escape') this.setState({ draft: '' });
      },
      slashOpen: slashOpen,
      slashItems: slashOpen ? sl.list.map((cm, i) => ({ name: cm.name, arg: cm.arg ? (cm.optional ? '[' : '‹') + (i === si && sl.arg ? sl.arg : cm.arg) + (cm.optional ? ']' : '›') : '', desc: cm.desc, on: i === si, bg: i === si ? 'rgba(255,255,255,0.07)' : 'transparent', pick: () => this.commitDraft(cm.name) })) : [],
      slashPreview: slashPreview, slashPreviewColor: slashPreviewColor,

      isOverview: S.panel === 'overview', isSearch: S.panel === 'search',
      showOverview: () => this.setState({ panel: 'overview' }),
      showSearch: () => this.setState({ panel: 'search' }),
      ovBg: S.panel === 'overview' ? tabOn : 'transparent', ovColor: S.panel === 'overview' ? c.text : c.text2,
      seBg: S.panel === 'search' ? tabOn : 'transparent', seColor: S.panel === 'search' ? c.text : c.text2,
      hasOutline: outline.length > 0, outline: outline,
      aggs: aggs, noAggs: aggs.length === 0,

      q: S.q, hasQ: !!S.q,
      onQ: (e) => this.setState({ q: e.target.value }),
      clearQ: () => this.setState({ q: '' }),
      hasSuggest: suggest.length > 0, suggest: suggest,
      saved: SAVED.map((q) => ({ q: q, bg: S.q.trim() === q ? tabOn : 'rgba(255,255,255,0.04)', color: S.q.trim() === q ? c.text : c.text2, pick: () => this.setState({ q: q }) })),
      resultSummary: res === null ? 'Type a query or pick a saved search. Plain words match text.' : nHits + (nHits === 1 ? ' line' : ' lines') + ' in ' + results.length + (results.length === 1 ? ' document' : ' documents'),
      results: results,

      palette: S.palette,
      closePalette: () => this.setState(close),
      palQ: S.palQ,
      onPalQ: (e) => this.setState({ palQ: e.target.value, palIdx: 0 }),
      onPalKey: (e) => {
        if (e.key === 'ArrowDown') { e.preventDefault(); this.setState({ palIdx: Math.min(palHits.length - 1, pi + 1) }); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); this.setState({ palIdx: Math.max(0, pi - 1) }); }
        else if (e.key === 'Enter' && palHits[pi]) palHits[pi].run();
        else if (e.key === 'Escape') this.setState(close);
      },
      palItems: palItems,

      hasToast: !!S.toast, toast: S.toast || '',
      hasToastAction: !!S.toastAction, toastLabel: S.toastAction ? S.toastAction.label : '',
      toastRun: () => { const a = S.toastAction; clearTimeout(this.tt); this.setState({ toast: null, toastAction: null, now: Date.now() }); if (a) a.apply(); }
    };
  }
}
