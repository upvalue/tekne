name: Check

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Check types, lint and formatting
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build server-backed production app
        run: pnpm build

      - name: Check server-backed bundle excludes PGlite WASM
        run: test -z "$(find dist -name '*.wasm' -print -quit)"

      - name: Build standalone demo
        run: pnpm client:build
        env:
          TEKNE_DEMO: 'true'
